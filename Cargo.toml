[package]
name = "rust-kv-store"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "A from-scratch framework for a persistent TCP key-value store"
license = "MIT"

[[bin]]
name = "kv-server"
path = "src/bin/server.rs"

[[bin]]
name = "kv-client"
path = "src/bin/client.rs"

[dependencies]
crc32fast = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = "3"
