[package]
name = "rust-kv-store"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "A persistent, multi-client key-value store written in Rust"
license = "MIT"

[[bin]]
name = "kv-server"
path = "src/bin/server.rs"

[[bin]]
name = "kv-client"
path = "src/bin/client.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
